    <script>
      // Aplica paleta de cor antes do primeiro paint (evita flash de cor errada).
      // Iframes do writer/finder leem o mesmo localStorage no init deles.
      (function(){
        try {
          var p = localStorage.getItem('aw-theme-palette');
          if (p === 'midnight-blue' || p === 'space-gray' || p === 'sei') document.documentElement.setAttribute('data-theme', p);
        } catch(e) {}
      })();
    </script>
    <script>
      // Desativa o pinch-zoom no mobile (iOS Safari e PWA ignoram user-scalable=no,
      // então bloqueamos os gestos de zoom do WebKit na mão). Não afeta o scroll.
      (function(){
        var stop = function(e){ e.preventDefault(); };
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('gestureend', stop, { passive: false });
      })();
    </script>
    <style>
      /* Remove o double-tap-to-zoom e o delay de 300ms — cara de app nativo. */
      html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
