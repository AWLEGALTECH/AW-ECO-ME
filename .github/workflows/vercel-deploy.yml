name: Vercel Deploy

# Deploy de producao via Vercel CLI (com token). Substitui o Deploy
# Hook anterior que ficava silenciosamente em PENDING sem buildar.
# A CLI cria o deploy diretamente — mais previsivel que webhook/hook.
#
# Pra ativar (uma vez so):
#   1. Vercel -> Account Settings -> Tokens -> Create Token
#      Nome: "github-actions-aw-eco-me", Scope: full account
#      Copia o token
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions
#      Adiciona 3 secrets:
#         VERCEL_TOKEN      = <token copiado>
#         VERCEL_ORG_ID     = team_aYcRugarEplOJzjmfZT3H3Nf
#         VERCEL_PROJECT_ID = prj_r5FwlEGbybDk7hhFQSr8CQ7mzvp1
#
# A secret VERCEL_DEPLOY_HOOK_MAIN antiga pode ser deletada.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
