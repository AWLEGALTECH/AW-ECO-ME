name: Vercel Deploy (bypass webhook)

# Contorna o webhook Vercel<->GitHub que para de funcionar de tempos
# em tempos. Cada push em main dispara um Vercel Deploy Hook (URL
# publica configurada no proprio dashboard do Vercel apontando pra
# branch main).
#
# Pra ativar:
#   1. Vercel -> projeto aw-eco-me -> Settings -> Git -> Deploy Hooks
#      Create: nome "main-prod", branch "main" -> copia a URL
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions
#      Nova secret: VERCEL_DEPLOY_HOOK_MAIN = <URL copiada>

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy (3 tentativas)
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_MAIN secret nao configurada."
            exit 1
          fi
          # Vercel hook as vezes aceita o POST (200) mas nao processa o job.
          # Disparamos 3 vezes com delay pra aumentar chance de pegar.
          for tentativa in 1 2 3; do
            echo "=== Tentativa $tentativa ==="
            RESPONSE=$(curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}" || echo "ERRO no curl")
            echo "Vercel respondeu: $RESPONSE"
            if [ "$tentativa" -lt 3 ]; then
              echo "Aguardando 30s antes da proxima tentativa..."
              sleep 30
            fi
          done

      # Deploy hooks das landings dos advogados (matheusenes.vercel.app,
      # diegoismael.vercel.app). Sao projetos Vercel SEPARADOS do app
      # principal — sem isso, mudar landing/ ou landing-di/ no main nao
      # atualizava o que o cliente final ve.
      #
      # Pra ativar:
      #   1. Vercel -> projeto "matheusenes" -> Settings -> Git -> Deploy
      #      Hooks -> Create -> branch main -> copia URL
      #      Idem pro "diegoismael"
      #   2. GitHub -> Settings -> Secrets and variables -> Actions:
      #      VERCEL_DEPLOY_HOOK_MATHEUS = <URL>
      #      VERCEL_DEPLOY_HOOK_DIEGO   = <URL>
      #
      # Se as secrets nao estiverem configuradas, esse step apenas avisa
      # e segue (nao falha o workflow).
      - name: Trigger landings dos advogados
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_MATHEUS }}" ]; then
            echo "=== Disparando matheusenes ==="
            curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_MATHEUS }}" || echo "Falhou"
          else
            echo "::warning::VERCEL_DEPLOY_HOOK_MATHEUS nao configurada — landing do Matheus nao sera atualizada automaticamente."
          fi
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_DIEGO }}" ]; then
            echo "=== Disparando diegoismael ==="
            curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_DIEGO }}" || echo "Falhou"
          else
            echo "::warning::VERCEL_DEPLOY_HOOK_DIEGO nao configurada — landing do Diego nao sera atualizada automaticamente."
          fi
