name: Vercel Deploy

# ESTE ARQUIVO NÃO PUBLICA NADA. ELE CONFERE.
#
# Por que mudou de novo, em 17/09/2026 à noite:
#
# A Vercel recusou o deploy do commit 8ff41bf com
#   "Deployment rate limited — retry in 24 hours"
# e a produção ficou parada. O teto diário de deploys do plano Hobby foi
# batido, e quem o gastou foi este workflow.
#
# Os três projetos (aw-eco-me, matheusenes, diegoismael) JÁ estão ligados a
# este repositório pela integração nativa da Vercel: a cada push na main o
# vercel[bot] cria os três deploys sozinho, em segundos. Dá para ver na API
# de deployments do GitHub, que lista os três ambientes por commit. Todo
# deploy de produção bem-sucedido deste repositório veio de lá.
#
# Em cima disso, este arquivo disparava:
#   3 POSTs no hook do aw-eco-me  (o laço "tentativa 1 2 3", sempre os três,
#                                  mesmo quando o primeiro funcionava)
#   1 POST no hook do matheusenes
#   1 POST no hook do diegoismael
#
# Oito deploys por push, onde três bastavam. Com um dia de trabalho intenso,
# o teto chega antes do fim da tarde, e o sintoma não é um erro: é a produção
# parando sem que nada fique vermelho.
#
# O laço de três existia para contornar o hook que aceita o POST e não cria
# build. A leitura certa dessa falha não era insistir: era não usar o hook,
# porque a integração nativa nunca precisou dele.
#
# ── o que sobrou ────────────────────────────────────────────────────────────
# O que faltava de verdade era saber QUANDO o deploy não acontece. Então o
# workflow agora só olha o status que o vercel[bot] escreve no commit e falha
# quando ele não fica verde. Não cria deploy nenhum, não gasta cota, e fica
# vermelho no dia em que a Vercel recusar de novo, com o motivo dela na tela.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    permissions:
      statuses: read
    steps:
      - name: Esperar a Vercel responder sobre este commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          echo "Conferindo o deploy de $SHA"
          # 20 voltas de 30s = 10 minutos. Um build deste projeto leva ~25s;
          # dez minutos cobrem fila, retentativa e um dia ruim da Vercel.
          for i in $(seq 1 20); do
            RESP=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/status")
            # Só os contextos da Vercel interessam: este próprio workflow
            # também escreve check, e olhar o estado geral seria olhar no
            # espelho e esperar resposta.
            LINHAS=$(echo "$RESP" | jq -r '.statuses[] | select(.context | startswith("Vercel")) | "\(.context)|\(.state)|\(.description)"')
            if [ -n "$LINHAS" ]; then
              echo "$LINHAS" | while IFS='|' read -r ctx estado desc; do
                echo "  $ctx: $estado ${desc:+($desc)}"
              done
              PENDENTE=$(echo "$LINHAS" | grep -c '|pending|' || true)
              FALHOU=$(echo "$LINHAS" | grep -cE '\|(failure|error)\|' || true)
              if [ "$FALHOU" -gt 0 ]; then
                echo "$LINHAS" | grep -E '\|(failure|error)\|' >> "$GITHUB_STEP_SUMMARY"
                echo "::error::A Vercel recusou o deploy deste commit. O motivo esta na linha acima."
                exit 1
              fi
              if [ "$PENDENTE" -eq 0 ]; then
                echo "Deploy publicado."
                echo "$LINHAS" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Dez minutos e a Vercel nao publicou nem recusou este commit. Confira o painel."
          exit 1
