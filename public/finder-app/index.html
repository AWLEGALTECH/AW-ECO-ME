    <title>AW FINDER · AW LEGALTECH</title>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <style>
      :root {
        --accent-h: 270;
        --accent-s: 60%;
        --accent-l: 60%;
        /* Paleta alinhada com aw-eco-me (preto puro). Estes tokens substituem
           os antigos rgba(2,1,5,...) / rgba(14,11,22,...) roxos do Finder. */
        --aw-bg: hsl(0 0% 3%);
        --aw-card: hsl(0 0% 6%);
        --aw-card-2: hsl(0 0% 9%);
        --aw-border: hsl(0 0% 14%);
        --aw-border-soft: hsla(0, 0%, 100%, 0.06);
        --aw-text: hsl(0 0% 98%);
        --aw-text-muted: hsl(0 0% 60%);
        --aw-text-dim: hsl(0 0% 40%);
      }
      [data-theme="midnight-blue"] {
        --accent-h: 222;
        --accent-s: 75%;
        --accent-l: 55%;
      }
      /* Space gray precisa override explicito das --violet-* porque o bundle JS
         hardcoda saturacao/luminancia em 60%/60%, anulando o --accent-s/l prateado.
         !important pra vencer o <style> que o React injeta em runtime no head. */
      html[data-theme="space-gray"] {
        --accent-h: 215 !important;
        --accent-s: 18% !important;
        --accent-l: 62% !important;
        --violet:             hsl(215 18% 62%) !important;
        --violet-soft:        hsl(215 12% 75%) !important;
        --violet-deep:        hsl(215 22% 48%) !important;
        --violet-border:      hsla(215, 18%, 62%, 0.35) !important;
        --violet-border-soft: hsla(215, 18%, 62%, 0.18) !important;
        --violet-bg:          hsla(215, 18%, 62%, 0.08) !important;
        --violet-glow:        hsla(215, 18%, 62%, 0.35) !important;
      }
      /* SEI no Finder = light mode (fundo branco) matching a shell */
      [data-theme="sei"] {
        --accent-h: 197;
        --accent-s: 67%;
        --accent-l: 47%;
        --aw-bg: hsl(0 0% 100%);
        --aw-card: hsl(0 0% 98%);
        --aw-card-2: hsl(0 0% 95%);
        --aw-border: hsl(0 0% 85%);
        --aw-border-soft: hsla(0, 0%, 0%, 0.06);
        --aw-text: hsl(0 0% 8%);
        --aw-text-muted: hsl(0 0% 42%);
        --aw-text-dim: hsl(0 0% 58%);
      }
      [data-theme="sei"] body, [data-theme="sei"] #root {
        background: white !important;
        color: black !important;
      }
      /* Wrapper principal do App.jsx tem bg:hsl(0 0% 3%) hardcoded.
         Forca branco no SEI cobrindo qualquer div filho direto do #root. */
      [data-theme="sei"] #root > div {
        background: white !important;
        color: black !important;
      }
      /* Header bar do Finder (Motor Ativo etc) */
      [data-theme="sei"] #root header {
        background: white !important;
        border-bottom-color: hsl(0 0% 88%) !important;
      }
      /* Coluna direita 'Fila de Análise' — herda do wrapper mas
         garante explicitamente */
      [data-theme="sei"] #root > div > div > div {
        background: transparent;
      }
      html, body, #root, input, button, textarea, select, label, p, h1, h2, h3, h4, h5, h6, div, span, a {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      html, body {
        background: var(--aw-bg);
        color: var(--aw-text);
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    <style>
      /* Cor primária do eco por tema. O motor de re-tematização (abaixo)
         reescreve o roxo fixo do Finder pra estas vars, então a cor passa a
         ACOMPANHAR o tema selecionado pelo usuário automaticamente. */
      /* Default = NEUTRO (cinza-ardósia), pra casar com o eco que é monocromático
         no uso normal (ícones/realces cinza, sem roxo). Temas coloridos abaixo
         mantêm a cor própria. */
      :root            { --aw-primary: #9aa3b2; --aw-primary-rgb: 154,163,178; }
      [data-theme="midnight-blue"] { --aw-primary: #2b65ee; --aw-primary-rgb: 43,101,238; }
      [data-theme="space-gray"]    { --aw-primary: #8d9bb0; --aw-primary-rgb: 141,155,176; }
      [data-theme="sei"]           { --aw-primary: #289bc8; --aw-primary-rgb: 40,155,200; }
      :root { --aw-primary-soft: color-mix(in srgb, var(--aw-primary) 62%, white); }
    </style>
    <script>
      (function(){
        try {
          var p = localStorage.getItem('aw-theme-palette');
          if (p === 'midnight-blue' || p === 'space-gray' || p === 'sei') document.documentElement.setAttribute('data-theme', p);
        } catch(e) {}
        window.addEventListener('message', function(e){
          if (e.origin !== window.location.origin) return;
          if (e.data && e.data.type === 'aw-theme:palette') {
            if (e.data.palette === 'default') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', e.data.palette);
          }
        });
      })();
    </script>
    <script>
      /* MOTOR DE INTEGRAÇÃO do Finder ao AW-ECO-ME (roda no doc do Finder):
         1) ROXO fixo (#8b5cf6 / #a78bfa / rgba(139,92,246,*)) das inline styles
            → var(--aw-primary*) (acompanha o tema do eco);
         2) títulos com gradiente roxo (background-clip:text) → texto BRANCO,
            como os títulos do eco;
         3) esconde a barra do topo (logo "FINDER"), o badge de marca e o "Sair"
            (que ia pra /api/logout e causava as bonecas russas). */
      (function () {
        function temAlvo(s){
          if (!s) return false; s = s.toLowerCase();
          return /#8b5cf6|#a78bfa|#6d28d9|139,\s?92,\s?246|109,\s?40,\s?217|12,\s?10,\s?18|14,\s?11,\s?22|8,\s?6,\s?14|2,\s?1,\s?5/.test(s);
        }
        function recolor(s){
          return s
            // roxos → cor primária do tema
            .replace(/#8b5cf6/gi, 'var(--aw-primary)')
            .replace(/#6d28d9/gi, 'var(--aw-primary)')
            .replace(/#a78bfa/gi, 'var(--aw-primary-soft)')
            .replace(/rgba\(\s*139\s*,\s*92\s*,\s*246\s*,\s*([0-9.]+)\s*\)/gi, 'rgba(var(--aw-primary-rgb),$1)')
            .replace(/rgba\(\s*109\s*,\s*40\s*,\s*217\s*,\s*([0-9.]+)\s*\)/gi, 'rgba(var(--aw-primary-rgb),$1)')
            .replace(/rgb\(\s*139\s*,\s*92\s*,\s*246\s*\)/gi, 'rgb(var(--aw-primary-rgb))')
            // "pretos" roxo-tingidos do Finder → preto neutro do eco
            .replace(/rgba\(\s*12\s*,\s*10\s*,\s*18\s*,/gi, 'rgba(15,15,17,')
            .replace(/rgba\(\s*14\s*,\s*11\s*,\s*22\s*,/gi, 'rgba(16,16,18,')
            .replace(/rgba\(\s*8\s*,\s*6\s*,\s*14\s*,/gi, 'rgba(10,10,11,')
            .replace(/rgba\(\s*2\s*,\s*1\s*,\s*5\s*,/gi, 'rgba(6,6,7,');
        }
        function processarCor(){
          var els = document.querySelectorAll('[style]');
          for (var i = 0; i < els.length; i++) {
            var st = els[i].getAttribute('style');
            if (st && temAlvo(st)) els[i].setAttribute('style', recolor(st));
          }
          var sv = document.querySelectorAll('[fill],[stroke]');
          for (var j = 0; j < sv.length; j++) {
            var f = (sv[j].getAttribute('fill') || '').toLowerCase();
            if ((f === '#8b5cf6' || f === '#a78bfa' || f === '#6d28d9') && sv[j].style.fill !== 'var(--aw-primary)') sv[j].style.fill = 'var(--aw-primary)';
            var k = (sv[j].getAttribute('stroke') || '').toLowerCase();
            if ((k === '#8b5cf6' || k === '#a78bfa' || k === '#6d28d9') && sv[j].style.stroke !== 'var(--aw-primary)') sv[j].style.stroke = 'var(--aw-primary)';
          }
        }
        function flatBg(){
          // achata o degradê radial de fundo (o "cenário") → preto chapado do eco
          var els = document.querySelectorAll('[style*="radial-gradient"]');
          for (var i = 0; i < els.length; i++) {
            if (els[i].clientHeight > 280 || els[i].clientWidth > 500) {
              els[i].style.setProperty('background-image', 'none', 'important');
              els[i].style.setProperty('background-color', 'var(--aw-bg)', 'important');
            }
          }
        }
        function neutralizarTitulos(){
          // títulos com gradiente recortado no texto → branco (como o eco)
          var els = document.querySelectorAll('[style*="clip"]');
          for (var i = 0; i < els.length; i++) {
            var st = els[i].getAttribute('style') || '';
            if (/clip\s*:\s*text/i.test(st) && els[i].style.webkitTextFillColor !== 'var(--aw-text)') {
              els[i].style.setProperty('-webkit-text-fill-color', 'var(--aw-text)', 'important');
              els[i].style.setProperty('color', 'var(--aw-text)', 'important');
              els[i].style.setProperty('background-image', 'none', 'important');
            }
          }
        }
        function normFonte(){
          // padroniza a tipografia exagerada do Finder pra escala do eco:
          // títulos gigantes encolhem; pesos 700-900 viram 600 (semibold).
          var els = document.querySelectorAll('[style*="font-"]');
          for (var i = 0; i < els.length; i++) {
            var el = els[i], st = el.getAttribute('style') || '';
            var mw = st.match(/font-weight\s*:\s*(\d{3})/i);
            if (mw && parseInt(mw[1], 10) >= 700 && el.style.fontWeight !== '600') {
              el.style.setProperty('font-weight', '600', 'important');
            }
            var ms = st.match(/font-size\s*:\s*([0-9.]+)px/i);
            if (ms) {
              var px = parseFloat(ms[1]);
              if (px > 34 && el.style.fontSize !== '30px') el.style.setProperty('font-size', '30px', 'important');
            }
          }
        }
        function esconderBranding(){
          var all = document.querySelectorAll('div,header,nav,section,span');
          // 1) barra do topo = menor container com "FINDER" + "Auditoria de Cobran"
          var bar = null, blen = Infinity;
          for (var i = 0; i < all.length; i++) {
            var t = all[i].textContent || '';
            if (t.indexOf('FINDER') >= 0 && /Auditoria de Cobran/.test(t) && t.length < 400 && t.length < blen) { bar = all[i]; blen = t.length; }
          }
          if (bar && bar.style.display !== 'none') bar.style.display = 'none';
          // 2) badge de marca "AW LEGALTECH · AUDITORIA BANCÁRIA"
          for (var j = 0; j < all.length; j++) {
            var tj = all[j].textContent || '';
            if (/AUDITORIA BANC[AÁ]RIA/i.test(tj) && tj.length < 80 && all[j].style.display !== 'none') all[j].style.display = 'none';
          }
          // 3) "Sair" solto
          var nd = document.querySelectorAll('button,a,div,span');
          for (var k = 0; k < nd.length; k++) {
            if ((nd[k].textContent || '').trim() === 'Sair' && nd[k].children.length === 0) {
              var p = nd[k].closest('button,a') || nd[k];
              if (p.style.display !== 'none') p.style.display = 'none';
            }
          }
        }
        var raf = 0;
        function sync(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(function(){ try { processarCor(); flatBg(); neutralizarTitulos(); normFonte(); esconderBranding(); } catch (e) {} }); }
        function start(){
          sync();
          try { new MutationObserver(sync).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
          setInterval(sync, 800);
        }
        if (document.readyState !== 'loading') start();
        else document.addEventListener('DOMContentLoaded', start);
      })();
    </script>
    <script type="module" crossorigin src="/finder-app/assets/index-ZvnDeb4-.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
