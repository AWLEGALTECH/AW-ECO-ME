<!doctype html>

  <head>

    <title>AW FINDER · AW LEGALTECH</title>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <style>
      :root {
        --accent-h: 270;
        --accent-s: 60%;
        --accent-l: 60%;
        /* Paleta alinhada com aw-eco-me (preto puro). Estes tokens substituem
           os antigos rgba(2,1,5,...) / rgba(14,11,22,...) roxos do Finder. */
        --aw-bg: hsl(0 0% 3%);
        --aw-card: hsl(0 0% 6%);
        --aw-card-2: hsl(0 0% 9%);
        --aw-border: hsl(0 0% 14%);
        --aw-border-soft: hsla(0, 0%, 100%, 0.06);
        --aw-text: hsl(0 0% 98%);
        --aw-text-muted: hsl(0 0% 60%);
        --aw-text-dim: hsl(0 0% 40%);
      }
      [data-theme="midnight-blue"] {
        --accent-h: 222;
        --accent-s: 75%;
        --accent-l: 55%;
      }
      [data-theme="vermelho"] {
        --accent-h: 0;
        --accent-s: 78%;
        --accent-l: 58%;
      }
      /* Space gray precisa override explicito das --violet-* porque o bundle JS
         hardcoda saturacao/luminancia em 60%/60%, anulando o --accent-s/l prateado.
         !important pra vencer o <style> que o React injeta em runtime no head. */
      html[data-theme="space-gray"] {
        --accent-h: 215 !important;
        --accent-s: 18% !important;
        --accent-l: 62% !important;
        --violet:             hsl(215 18% 62%) !important;
        --violet-soft:        hsl(215 12% 75%) !important;
        --violet-deep:        hsl(215 22% 48%) !important;
        --violet-border:      hsla(215, 18%, 62%, 0.35) !important;
        --violet-border-soft: hsla(215, 18%, 62%, 0.18) !important;
        --violet-bg:          hsla(215, 18%, 62%, 0.08) !important;
        --violet-glow:        hsla(215, 18%, 62%, 0.35) !important;
      }
      /* SEI no Finder = light mode (fundo branco) matching a shell */
      [data-theme="sei"] {
        --accent-h: 197;
        --accent-s: 67%;
        --accent-l: 47%;
        --aw-bg: hsl(0 0% 100%);
        --aw-card: hsl(0 0% 98%);
        --aw-card-2: hsl(0 0% 95%);
        --aw-border: hsl(0 0% 85%);
        --aw-border-soft: hsla(0, 0%, 0%, 0.06);
        --aw-text: hsl(0 0% 8%);
        --aw-text-muted: hsl(0 0% 42%);
        --aw-text-dim: hsl(0 0% 58%);
      }
      [data-theme="sei"] body, [data-theme="sei"] #root {
        background: white !important;
        color: black !important;
      }
      /* Wrapper principal do App.jsx tem bg:hsl(0 0% 3%) hardcoded.
         Forca branco no SEI cobrindo qualquer div filho direto do #root. */
      [data-theme="sei"] #root > div {
        background: white !important;
        color: black !important;
      }
      /* Header bar do Finder (Motor Ativo etc) */
      [data-theme="sei"] #root header {
        background: white !important;
        border-bottom-color: hsl(0 0% 88%) !important;
      }
      /* Coluna direita 'Fila de Análise' — herda do wrapper mas
         garante explicitamente */
      [data-theme="sei"] #root > div > div > div {
        background: transparent;
      }
      /* BRANCO no Finder. O Finder é um pacote compilado, com cinza-carvão
         escrito à mão em centenas de lugares; trocar token por token deixaria
         metade escura. Então a página inteira é INVERTIDA (o escuro vira
         claro e o texto claro vira tinta) e o giro de 180° no matiz devolve a
         cor certa ao verde, ao âmbar e ao vermelho, que voltam escuros e
         legíveis sobre o branco. Os tokens abaixo são escolhidos para que,
         DEPOIS de invertidos, o fundo dê branco puro, a borda dê cinza fino e
         o destaque dê grafite. Foto, vídeo e canvas (a página do extrato)
         invertem de novo para voltar ao natural. */
      html[data-theme="branco"] {
        filter: invert(1) hue-rotate(180deg);
        background: #000;
        --accent-h: 0 !important;
        --accent-s: 0% !important;
        --accent-l: 50% !important;
        /* o pacote fixa 95% de saturação num tom claro do destaque (selos,
           ícones); a variável foi posta no lugar do número, com 95% de reserva */
        --sat-destaque: 0%;
        --violet:             hsl(0 0% 50%) !important;
        --violet-soft:        hsl(0 0% 78%) !important;
        --violet-deep:        hsl(0 0% 40%) !important;
        --violet-border:      hsla(0, 0%, 100%, 0.22) !important;
        --violet-border-soft: hsla(0, 0%, 100%, 0.12) !important;
        --violet-bg:          hsla(0, 0%, 100%, 0.06) !important;
        --violet-glow:        transparent !important;
        --aw-bg: hsl(0 0% 0%);
        --aw-card: hsl(0 0% 2%);
        --aw-card-2: hsl(0 0% 5%);
        --aw-border: hsl(0 0% 11%);
        --aw-border-soft: hsla(0, 0%, 100%, 0.08);
        --aw-text: hsl(0 0% 91%);
        --aw-text-muted: hsl(0 0% 60%);
        --aw-text-dim: hsl(0 0% 45%);
      }
      /* o invólucro do App.jsx tem hsl(0 0% 3%) escrito à mão, que invertido
         daria um branco sujo; aqui ele é preto puro, e vira papel */
      html[data-theme="branco"] body,
      html[data-theme="branco"] #root > div { background: #000 !important; }
      html[data-theme="branco"] img:not([src$=".svg"]),
      html[data-theme="branco"] video,
      html[data-theme="branco"] canvas,
      html[data-theme="branco"] iframe {
        filter: invert(1) hue-rotate(180deg);
      }
      html[data-theme="branco"] *,
      html[data-theme="branco"] *::before,
      html[data-theme="branco"] *::after {
        box-shadow: none !important;
        text-shadow: none !important;
      }
      html, body, #root, input, button, textarea, select, label, p, h1, h2, h3, h4, h5, h6, div, span, a {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      html, body {
        background: var(--aw-bg);
        color: var(--aw-text);
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    <script>
      (function(){
        try {
          var p = localStorage.getItem('aw-theme-palette');
          if (p === 'midnight-blue' || p === 'vermelho' || p === 'space-gray' || p === 'sei' || p === 'branco') document.documentElement.setAttribute('data-theme', p);
        } catch(e) {}
        window.addEventListener('message', function(e){
          if (e.origin !== window.location.origin) return;
          if (e.data && e.data.type === 'aw-theme:palette') {
            if (e.data.palette === 'default') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', e.data.palette);
          }
        });
      })();
    </script>
    <!-- Esconde o badge "Motor Ativo" do header SEM tocar no bundle compilado.
         Observa o DOM e some com o elemento assim que ele renderiza/re-renderiza. -->
    <script>
      (function () {
        function hideMotorAtivo() {
          var nodes = document.querySelectorAll('header *');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.childElementCount <= 1 && el.textContent && el.textContent.trim() === 'Motor Ativo') {
              el.style.display = 'none';
            }
          }
        }
        var obs = new MutationObserver(hideMotorAtivo);
        function start() {
          hideMotorAtivo();
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
        else start();
      })();
    </script>
    <script type="module" crossorigin src="/finder-app/assets/index-DYBOv29h.js"></script>
  </head>
