<!doctype html>
<html lang="pt-BR">
  <head>

    <title>AW FINDER · AW LEGALTECH</title>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <style>
      :root {
        --accent-h: 270;
        --accent-s: 60%;
        --accent-l: 60%;
        /* Paleta alinhada com aw-eco-me (preto puro). Estes tokens substituem
           os antigos rgba(2,1,5,...) / rgba(14,11,22,...) roxos do Finder. */
        --aw-bg: hsl(0 0% 3%);
        --aw-card: hsl(0 0% 6%);
        --aw-card-2: hsl(0 0% 9%);
        --aw-border: hsl(0 0% 14%);
        --aw-border-soft: hsla(0, 0%, 100%, 0.06);
        --aw-text: hsl(0 0% 98%);
        --aw-text-muted: hsl(0 0% 60%);
        --aw-text-dim: hsl(0 0% 40%);
      }
      [data-theme="midnight-blue"] {
        --accent-h: 222;
        --accent-s: 75%;
        --accent-l: 55%;
      }
      /* SEI no Finder = light mode (fundo branco) matching a shell */
      [data-theme="sei"] {
        --accent-h: 197;
        --accent-s: 67%;
        --accent-l: 47%;
        --aw-bg: hsl(0 0% 100%);
        --aw-card: hsl(0 0% 98%);
        --aw-card-2: hsl(0 0% 95%);
        --aw-border: hsl(0 0% 85%);
        --aw-border-soft: hsla(0, 0%, 0%, 0.06);
        --aw-text: hsl(0 0% 8%);
        --aw-text-muted: hsl(0 0% 42%);
        --aw-text-dim: hsl(0 0% 58%);
      }
      [data-theme="sei"] body, [data-theme="sei"] #root {
        background: white !important;
        color: black !important;
      }
      /* Wrapper principal do App.jsx tem bg:hsl(0 0% 3%) hardcoded.
         Forca branco no SEI pra cobrir todo o canvas. */
      [data-theme="sei"] #root > div[style*="minHeight"] {
        background: white !important;
        color: black !important;
      }
      /* Header bar do Finder (Motor Ativo etc) — fica branco no SEI */
      [data-theme="sei"] #root > div > header {
        border-bottom-color: hsl(0 0% 88%) !important;
      }
      html, body, #root, input, button, textarea, select, label, p, h1, h2, h3, h4, h5, h6, div, span, a {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      html, body {
        background: var(--aw-bg);
        color: var(--aw-text);
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    <script>
      (function(){
        try {
          var p = localStorage.getItem('aw-theme-palette');
          if (p === 'midnight-blue' || p === 'sei') document.documentElement.setAttribute('data-theme', p);
        } catch(e) {}
        window.addEventListener('message', function(e){
          if (e.origin !== window.location.origin) return;
          if (e.data && e.data.type === 'aw-theme:palette') {
            if (e.data.palette === 'default') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', e.data.palette);
          }
        });
      })();
    </script>
    <script type="module" crossorigin src="/finder-app/assets/index-DnvgcvXO.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
