<script>
  // Aplica paleta antes do primeiro paint (sincroniza com o tema escolhido
  // no aw-eco-me — localStorage e' compartilhado same-origin).
  (function(){
    try {
      var p = localStorage.getItem('aw-theme-palette');
      if (p === 'midnight-blue' || p === 'vermelho' || p === 'space-gray' || p === 'sei') document.documentElement.setAttribute('data-theme', p);
    } catch(e) {}
    // Listener pra trocar tema ao vivo enquanto o iframe ja esta aberto
    window.addEventListener('message', function(e) {
      if (e.origin !== window.location.origin) return;
      if (e.data && e.data.type === 'aw-theme:palette') {
        if (e.data.palette === 'default') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', e.data.palette);
        }
      }
    });
  })();
</script>

        </svg>
      </button>
    </div>
  </div>

  <main id="view"></main>

<!-- Modal Config · duas etapas -->
<div id="modalConfig" class="modal hidden">
  <div class="modal-box">

    <!-- ETAPA 1 · gate de senha -->
    <div class="modal-stage" id="modalStageGate">
      <div class="modal-title">Área restrita</div>
      <div class="modal-sub">
        Apenas o admin do escritório pode ver e alterar as URLs dos webhooks.
      </div>
      <div class="modal-lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <div class="modal-field">
        <div class="field-label"><span class="field-label-text">Senha de admin</span></div>
        <input id="gatePasswordInput" type="password" placeholder="Digite a senha" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();destrancarConfig();}">
      </div>
      <div id="gateMsg" class="modal-msg"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-small" onclick="fecharConfig()">Fechar</button>
        <button id="btnDestrancar" class="btn btn-primary btn-small" onclick="destrancarConfig()">Entrar</button>
      </div>
    </div>

    <!-- ETAPA 2 · campos reais -->
    <div class="modal-stage" id="modalStagePanel" style="display:none">
      <div class="modal-title">Webhooks do n8n</div>
      <div class="modal-sub">
        As URLs ficam salvas em um servidor central e valem para todos os usuários.
      </div>
      <div class="modal-field">
        <div class="field-label"><span class="field-label-text">Webhook · gerar trechos de IA</span></div>
        <input id="webhookTrechosInput" type="text" placeholder="https://n8n.awlegaltech.com.br/webhook/gerar-trechos">
      </div>
      <div class="modal-field">
        <div class="field-label"><span class="field-label-text">Webhook · gerar peça final <em style="color:var(--text-ghost);font-style:normal;font-size:0.85em;">(legado · não usado)</em></span></div>
        <input id="webhookPecaInput" type="text" placeholder="Não utilizado — geração agora acontece no navegador">
      </div>
      <div id="panelMsg" class="modal-msg"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-small" onclick="fecharConfig()">Fechar</button>
        <button id="btnSalvarConfig" class="btn btn-primary btn-small" onclick="salvarConfig()">Salvar alterações</button>
      </div>
    </div>

  </div>
</div>
